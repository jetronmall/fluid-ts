openapi: 3.1.0
info:
  title: Jetron Ticket — Headless API
  version: '1.0.0'
  description: |
    Public REST API for external event hosts (partners) to power a white-label
    ticket-buying flow. Browse the host's public events, reserve tickets for an
    attendee, and create an order (checkout) on your own frontend.

    ## Checkout flow
    1. `POST /events/{slug}/reservations` prices the cart and holds the stock for
       a limited window. It returns a `reservationToken` and a `quoteReference`.
    2. Render your custom checkout page. Use `clientExpiresAt` to drive a
       countdown.
    3. `POST /events/{slug}/orders` completes checkout. Echo the `reservationToken`
       as the `X-Device-ID` header and send the `quoteReference` back. Paid orders
       return the payment link in `checkoutUrl`; free orders are confirmed immediately.
       Both return the order's `reference`.
    4. After payment the attendee lands on your `callbackUrl` with `reference` in
       the query string. `GET /events/{slug}/orders/{reference}` returns the order
       once tickets are issued, and `404` until then.
    5. `DELETE /events/{slug}/reservations` releases a hold early (also echo the
       token as `X-Device-ID`). Holds otherwise expire on their own.

    Tickets to reserved-seating (seats.io) events are not supported over this
    API yet and return `400`. Events with a waiting room return `403` from reservations.
    Reservations and orders are not cached.

    ## Sales
    An event can split ticket sales into timed sales, such as a presale and a
    general sale. `GET /events/{slug}/sales` lists them with their phase and
    dates, so you can show countdowns. Tickets in a sale that has not started
    report `SALE_NOT_STARTED`. A sale can require a password: check it with
    `POST /events/{slug}/sales/{saleId}/verify-password`, then send `saleId`
    and `salePassword` with the reservation. Attendees can join a sale's
    waitlist with `POST /events/{slug}/sales/{saleId}/waitlist` to be emailed
    when it opens.

    ## Add-ons
    Events can sell add-ons such as parking, merch or priority access.
    `GET /events/{slug}/addons` lists the ones on sale. Add-ons that come with a
    ticket are listed on that ticket as `includedAddons` and need no action from
    the buyer.

    To sell add-ons, send `addons` with the reservation, next to `items` or on
    their own. A reservation with only add-ons needs `buyerEmail`: the add-ons
    are delivered to it. The buyer needs no ticket, unless the add-on has
    `ticketIds`: then one of those tickets must be in the cart, or already be
    held by `buyerEmail` when the add-ons are bought on their own. Promo codes
    discount tickets only and cannot be sent with add-ons alone.

    Every add-on that is scanned has one QR code per unit. Attendees find theirs
    in the confirmation email. To show them in your own app, use `addons` on
    each ticket from `POST /attendees/tickets/lookup` for included add-ons, and
    `POST /attendees/addons/lookup` for bought ones.

    ## Webhooks
    `TICKET_PURCHASED` lists the add-ons bought with tickets in `data.addons`.
    When add-ons are bought on their own, the same webhook URLs receive
    `ADDON_PURCHASED` instead, with `eventId`, `reference`, `amount`,
    `formattedAmount`, `paidAt`, `sentAt`, `addons` and `metadata` in `data`.
    Each add-on has `addonId`, `name`, `quantity`, `amount`, `formattedAmount`
    and `customer`. Check `eventType` before reading `data`.

    ## Host and event content
    `GET /host` returns the profile of the host that owns the API key, for your
    site header. Each event also has its lineup (`headliners` on the event),
    sponsors (`GET /events/{slug}/sponsors`) and moments, the photos attendees
    post from the event (`GET /events/{slug}/moments`).

    ## Calling from a browser or a server
    Every endpoint except the attendee lookups takes the public key, so
    you can call it from browser code or from your own server. Event, ticket and sale reads are the same for
    every visitor, so they suit server rendering and caching. Reservation,
    order, password and waitlist calls act for one attendee: from a server,
    send a separate `X-Device-ID` per attendee, never one shared value.

    ## Authentication
    Authenticated endpoints require your API key as a Bearer token:

        Authorization: Bearer jt_public_xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx

    All events are automatically scoped to the event host that owns the API key.

    ## Attendee tickets and add-ons
    `POST /attendees/tickets/lookup` returns the tickets an email holds for your
    events, and `POST /attendees/addons/lookup` the add-ons it bought, so
    attendees can see their QR codes in your own app. Both take your
    private key (`jt_private_...`) and must only be called from your server,
    after your app has verified that the signed-in user owns the email. The
    public key gets `403`.

    ## Response envelope
    Successful responses are wrapped as `{ "data": <payload>, "status": true }`.
    Errors are returned as `{ "message": string, "status": <http code>,
    "error_code": string }`.

    ## Money
    All monetary amounts are integers in the smallest currency unit
    (kobo for NGN, pesewa for GHS, cents for ZAR).

    ## Caching
    `GET` event endpoints return an `ETag` and a `Cache-Control` header. Send the
    `ETag` back as `If-None-Match` on your next request; if nothing changed the
    API responds `304 Not Modified` with an empty body. Responses are host-scoped
    (`private`) and short-lived; edits to an event invalidate its cache
    immediately.

servers:
  - url: http://localhost:8003/api/v1
    description: Local development
  - url: https://{host}/api/v1
    description: Deployment
    variables:
      host:
        default: your-headless-host
        description: The host serving the headless API

tags:
  - name: Events
    description: Browse a host's public events
  - name: Host
    description: The host that owns the API key
  - name: Sales
    description: Timed sales, sale passwords and waitlists
  - name: Checkout
    description: Reserve tickets and add-ons and create orders for your attendees
  - name: Attendees
    description: Tickets and add-ons your attendees hold, for server-side use with the private key
  - name: System
    description: Health and service metadata

paths:
  /health:
    get:
      tags: [System]
      summary: Health check
      description: |
        Always returns `200`. Read `status` to tell whether the service is ready:
        it is `false` when Postgres, Redis or MongoDB is unreachable. Meilisearch,
        RabbitMQ, Neo4j and AI are reported for observability but do not affect
        `status`.
      security: []
      responses:
        '200':
          description: The readiness of the service and each dependency
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthEnvelope'

  /host:
    get:
      tags: [Host]
      summary: Get the host profile
      description: |
        Returns the profile of the host that owns the API key: name, slug,
        profile image and banner. Use it for your site header or footer.
      parameters:
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: The host profile
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required: [status, data]
                properties:
                  status:
                    type: boolean
                    const: true
                  data:
                    $ref: '#/components/schemas/Host'
        '304':
          $ref: '#/components/responses/NotModified'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /events:
    get:
      tags: [Events]
      summary: List events
      description: Lists the API key host's public events, newest first, with cursor pagination.
      parameters:
        - $ref: '#/components/parameters/Category'
        - $ref: '#/components/parameters/Query'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: A page of events
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required: [status, data]
                properties:
                  status:
                    type: boolean
                    const: true
                  data:
                    $ref: '#/components/schemas/EventList'
        '304':
          $ref: '#/components/responses/NotModified'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /events/{slug}:
    get:
      tags: [Events]
      summary: Get an event
      description: Fetches a single public event by its slug, scoped to the API key host.
      parameters:
        - $ref: '#/components/parameters/EventSlug'
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: The event
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required: [status, data]
                properties:
                  status:
                    type: boolean
                    const: true
                  data:
                    $ref: '#/components/schemas/Event'
        '304':
          $ref: '#/components/responses/NotModified'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /events/{slug}/gallery:
    get:
      tags: [Events]
      summary: List an event's gallery images
      description: Lists gallery images for a public event in stable creation order, scoped to the API key host.
      parameters:
        - $ref: '#/components/parameters/EventSlug'
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: The event's gallery images
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required: [status, data]
                properties:
                  status:
                    type: boolean
                    const: true
                  data:
                    $ref: '#/components/schemas/EventGallery'
        '304':
          $ref: '#/components/responses/NotModified'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /events/{slug}/sponsors:
    get:
      tags: [Events]
      summary: List an event's sponsors
      description: Lists the sponsors shown on a public event's page, in the order they were added.
      parameters:
        - $ref: '#/components/parameters/EventSlug'
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: The event's sponsors
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required: [status, data]
                properties:
                  status:
                    type: boolean
                    const: true
                  data:
                    $ref: '#/components/schemas/SponsorList'
        '304':
          $ref: '#/components/responses/NotModified'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /events/{slug}/moments:
    get:
      tags: [Events]
      summary: List an event's moments
      description: |
        Lists moments, the photos attendees post from the event on Jetron
        Ticket, newest first, with cursor pagination. Moments that were
        removed are left out.
      parameters:
        - $ref: '#/components/parameters/EventSlug'
        - $ref: '#/components/parameters/MomentLimit'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: A page of moments
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required: [status, data]
                properties:
                  status:
                    type: boolean
                    const: true
                  data:
                    $ref: '#/components/schemas/MomentList'
        '304':
          $ref: '#/components/responses/NotModified'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /events/{slug}/tickets:
    get:
      tags: [Events]
      summary: List an event's tickets
      description: |
        Lists the purchasable ticket types for an event, ordered by their display
        position. A ticket that only a sale can unlock lists that sale in
        `sales`, and its `status` is `SALE_NOT_STARTED` before the sale opens and
        `SALE_ENDED` after the last one closes. Pass `saleId` to report statuses
        for one sale, for example on a presale page.
      parameters:
        - $ref: '#/components/parameters/EventSlug'
        - name: saleId
          in: query
          required: false
          description: Report ticket statuses for this sale only. Must belong to the event.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The event's ticket types
          content:
            application/json:
              schema:
                type: object
                required: [status, data]
                properties:
                  status:
                    type: boolean
                    const: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Ticket'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /events/{slug}/addons:
    get:
      tags: [Events]
      summary: List an event's add-ons
      description: |
        Lists the add-ons on sale for an event, ordered by their display
        position. Add-ons whose `deadline` has passed and add-ons that only come
        with a ticket are left out; the latter are on the ticket as
        `includedAddons`. Send `X-Device-ID` so the attendee's own reservation
        is not counted against `quantityLeft`.
      parameters:
        - $ref: '#/components/parameters/EventSlug'
        - $ref: '#/components/parameters/DeviceIdAddons'
      responses:
        '200':
          description: The event's add-ons
          content:
            application/json:
              schema:
                type: object
                required: [status, data]
                properties:
                  status:
                    type: boolean
                    const: true
                  data:
                    $ref: '#/components/schemas/AddonList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /events/{slug}/sales:
    get:
      tags: [Sales]
      summary: List an event's sales
      description: |
        Lists every sale for an event, including ended ones, ordered by start
        date. Use `phase`, `startDate` and `endDate` to show countdowns and
        labels such as "Presale opens in 2 days". `phase` is worked out when you
        make the request, so refetch it when a countdown reaches zero.
      parameters:
        - $ref: '#/components/parameters/EventSlug'
      responses:
        '200':
          description: The event's sales
          content:
            application/json:
              schema:
                type: object
                required: [status, data]
                properties:
                  status:
                    type: boolean
                    const: true
                  data:
                    $ref: '#/components/schemas/SaleList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /events/{slug}/sales/{saleId}/verify-password:
    post:
      tags: [Sales]
      summary: Check a sale password
      description: |
        Checks a password for a sale that is open now, so you can unlock the
        sale's tickets before reserving. Passwords are not case-sensitive. A
        correct password is not remembered: send it again as `salePassword`
        when you create the reservation. Returns `400` for a wrong password or a
        sale that is not open.
      parameters:
        - $ref: '#/components/parameters/EventSlug'
        - $ref: '#/components/parameters/SaleId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifySalePasswordRequest'
      responses:
        '200':
          description: The password is correct, or the sale has no password
          content:
            application/json:
              schema:
                type: object
                required: [status, data]
                properties:
                  status:
                    type: boolean
                    const: true
                  data:
                    $ref: '#/components/schemas/VerifySalePasswordResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /events/{slug}/sales/{saleId}/waitlist:
    post:
      tags: [Sales]
      summary: Join a sale's waitlist
      description: |
        Adds an attendee to a sale's waitlist. They get a confirmation email
        and, unless the organiser has turned these off, an email when the sale
        is about to open. Joining again with the same email is safe. Signups close once the sale is about to open (see the
        sale's `waitlistOpen`); later attempts return `400`.
      parameters:
        - $ref: '#/components/parameters/EventSlug'
        - $ref: '#/components/parameters/SaleId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JoinSaleWaitlistRequest'
      responses:
        '200':
          description: The attendee is on the waitlist
          content:
            application/json:
              schema:
                type: object
                required: [status, data]
                properties:
                  status:
                    type: boolean
                    const: true
                  data:
                    $ref: '#/components/schemas/JoinSaleWaitlistResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /events/{slug}/promo-codes/validate:
    post:
      tags: [Checkout]
      summary: Check a promo code
      description: |
        Checks a promo code before the attendee reserves, so you can show the
        discount early. Send the ticket IDs in the cart: a code limited to some
        tickets returns `400` without them, or when the cart has other tickets.
        Only codes that belong to this event work. Checking a code does not
        hold it: send it as `promoCode` when you create the reservation, which
        applies the discount. Returns `404` for an unknown or expired code and
        `400` when the code has no uses left.
      parameters:
        - $ref: '#/components/parameters/EventSlug'
        - $ref: '#/components/parameters/DeviceIdPromoCode'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidatePromoCodeRequest'
      responses:
        '200':
          description: The code is valid for this cart
          content:
            application/json:
              schema:
                type: object
                required: [status, data]
                properties:
                  status:
                    type: boolean
                    const: true
                  data:
                    $ref: '#/components/schemas/PromoCode'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /events/{slug}/reservations:
    post:
      tags: [Checkout]
      summary: Create or refresh a reservation
      description: |
        Prices the cart and holds the requested stock for the checkout window.
        Returns a `reservationToken` and a `quoteReference`. Send the same
        `X-Device-ID` again to refresh the attendee's reservation. A promo code
        must belong to the event in `{slug}`; global promo codes are not
        supported. To buy tickets from a sale, send `saleId`, and
        `salePassword` when the sale has one. Tickets to reserved-seating events
        return `400`. Events with a waiting room return `403`.

        Send `addons` to sell add-ons with the tickets, or on their own with
        `buyerEmail`. Reservations without tickets are limited to 30 a minute per
        client IP when an add-on is free or limited to certain tickets, because
        they check what `buyerEmail` holds or has claimed.
      parameters:
        - $ref: '#/components/parameters/EventSlug'
        - $ref: '#/components/parameters/DeviceIdOptional'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReservationRequest'
      responses:
        '200':
          description: The reservation and its signed quote
          content:
            application/json:
              schema:
                type: object
                required: [status, data]
                properties:
                  status:
                    type: boolean
                    const: true
                  data:
                    $ref: '#/components/schemas/Reservation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    delete:
      tags: [Checkout]
      summary: Release a reservation
      description: |
        Releases a held reservation, freeing the tickets and add-ons. Echo the
        `reservationToken` as the `X-Device-ID` header. If omitted, the server
        falls back to the reservation held for your client IP + event (the same
        fallback used when reserving without a token). Returns `400` if neither
        a token nor a matching anonymous reservation is found.
      parameters:
        - $ref: '#/components/parameters/EventSlug'
        - $ref: '#/components/parameters/DeviceIdReleaseOptional'
      responses:
        '200':
          description: The reservation was released
          content:
            application/json:
              schema:
                type: object
                required: [status, data]
                properties:
                  status:
                    type: boolean
                    const: true
                  data:
                    type: object
                    required: [released]
                    properties:
                      released:
                        type: boolean
                        const: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /events/{slug}/orders:
    post:
      tags: [Checkout]
      summary: Create an order (checkout)
      description: |
        Completes checkout for a held reservation. Echo the `reservationToken`
        as the `X-Device-ID` header and send the `quoteReference` from the
        reservation response. Free (zero-total) orders are
        fulfilled immediately and return `status: confirmed`; paid orders return
        `status: pending_payment` and a payment link in `checkoutUrl`. Both
        return the order's `reference`. After payment the attendee is redirected
        to your `callbackUrl` with `reference` in the query string. The redirect
        alone does not prove payment: confirm it with
        `GET /events/{slug}/orders/{reference}` or the `TICKET_PURCHASED` or
        `ADDON_PURCHASED` webhook. A duplicate order for the same reservation returns `409`.
      parameters:
        - $ref: '#/components/parameters/EventSlug'
        - $ref: '#/components/parameters/DeviceIdRequired'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
      responses:
        '200':
          description: The order was created
          content:
            application/json:
              schema:
                type: object
                required: [status, data]
                properties:
                  status:
                    type: boolean
                    const: true
                  data:
                    $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /events/{slug}/orders/{reference}:
    get:
      tags: [Checkout]
      summary: Get an order
      description: |
        Returns an order once payment is confirmed and its tickets and add-ons
        are issued. `items` is empty when only add-ons were bought.
        Use it on your `callbackUrl` page, with the `reference` from the query
        string. Until the order exists it returns `404`: payment confirmation
        usually takes a few seconds, so retry every couple of seconds for up to
        a minute before telling the attendee to check their email. An unpaid or
        abandoned payment also returns `404`. Buyer details are not returned;
        the `TICKET_PURCHASED` and `ADDON_PURCHASED` webhooks carry them.
      parameters:
        - $ref: '#/components/parameters/EventSlug'
        - name: reference
          in: path
          required: true
          description: The order `reference`, from the order response or the `callbackUrl` query string.
          schema:
            type: string
      responses:
        '200':
          description: The order
          content:
            application/json:
              schema:
                type: object
                required: [status, data]
                properties:
                  status:
                    type: boolean
                    const: true
                  data:
                    $ref: '#/components/schemas/OrderDetails'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /attendees/tickets/lookup:
    post:
      tags: [Attendees]
      summary: Look up an attendee's tickets
      description: |
        Returns the tickets an email currently holds for your events, newest
        activity first. Tickets transferred away from the email are left out and
        tickets transferred to it are included. Refunded orders and invalidated
        tickets are left out. Requires the private key; call it from your server
        only, after verifying the attendee owns the email.

        `qrCode` is the value to render as the entry QR code. It is only present
        for `VALID` tickets. A `TRANSFER_PENDING` ticket cannot be scanned until
        the recipient accepts or the transfer is cancelled. When an event has
        Website & App Only turned on, its tickets stay locked until the event's
        Ticket Release Time before each ticket's date (7 days unless the
        organizer changes it). Until then the ticket is `LOCKED`, and
        `unlocksAt` says when its QR code becomes available. Fetch the ticket
        again after that time to get it. Each ticket's `addons` are the add-ons
        that came with it; their codes are left out while the ticket is `LOCKED`
        or `TRANSFER_PENDING`. Responses are sent
        with `Cache-Control: no-store`; do not cache them, because scans change
        ticket status live.
      security:
        - PrivateApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LookupAttendeeTicketsRequest'
      responses:
        '200':
          description: The attendee's ticket orders
          content:
            application/json:
              schema:
                type: object
                required: [status, data]
                properties:
                  status:
                    type: boolean
                    const: true
                  data:
                    $ref: '#/components/schemas/AttendeeTicketOrderList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /attendees/addons/lookup:
    post:
      tags: [Attendees]
      summary: Look up the add-ons an attendee bought
      description: |
        Returns the add-ons an email bought for your events, newest first.
        Refunded and cancelled add-ons are left out. Add-ons that came with a
        ticket are not here: they are on the ticket in
        `POST /attendees/tickets/lookup`. Requires the private key; call it from
        your server only, after verifying the attendee owns the email. Responses
        are sent with `Cache-Control: no-store`; do not cache them, because
        scans change codes live.
      security:
        - PrivateApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LookupAttendeeAddonsRequest'
      responses:
        '200':
          description: The add-ons the attendee bought
          content:
            application/json:
              schema:
                type: object
                required: [status, data]
                properties:
                  status:
                    type: boolean
                    const: true
                  data:
                    $ref: '#/components/schemas/AttendeeAddonPurchaseList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'

components:
  securitySchemes:
    ApiKeyAuth:
      type: http
      scheme: bearer
      description: Your public API key (e.g. `jt_public_...`) passed as a Bearer token.
    PrivateApiKeyAuth:
      type: http
      scheme: bearer
      description: Your private API key (e.g. `jt_private_...`) passed as a Bearer token. Server-side only.

  parameters:
    SaleId:
      name: saleId
      in: path
      required: true
      description: The sale's ID, from the sales endpoint.
      schema:
        type: string
        format: uuid
    EventSlug:
      name: slug
      in: path
      required: true
      description: The event's URL slug.
      schema:
        type: string
    Category:
      name: category
      in: query
      required: false
      description: Filter events by category slug.
      schema:
        type: string
    Query:
      name: q
      in: query
      required: false
      description: Full-text search query.
      schema:
        type: string
    Limit:
      name: limit
      in: query
      required: false
      description: Page size (1–100).
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    MomentLimit:
      name: limit
      in: query
      required: false
      description: Page size (1–50).
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 20
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque pagination cursor returned as `nextCursor`.
      schema:
        type: string
    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      description: An `ETag` from a previous response. Returns `304` if unchanged.
      schema:
        type: string
    DeviceIdOptional:
      name: X-Device-ID
      in: header
      required: false
      description: |
        A UUID identifying one attendee's cart. Create one per attendee, keep it
        for their visit, and send it on every reservation and order call. The
        reservation response returns it as `reservationToken`.

        If omitted, the server reuses one token per client IP and event, so
        every attendee behind the same IP shares one reservation. When you call
        from your own server, every attendee shares your server's IP, so always
        send a separate token per attendee.
      schema:
        type: string
        format: uuid
    DeviceIdAddons:
      name: X-Device-ID
      in: header
      required: false
      description: The attendee's `reservationToken`, if they already have a reservation.
      schema:
        type: string
        format: uuid
    DeviceIdPromoCode:
      name: X-Device-ID
      in: header
      required: false
      description: |
        The attendee's `reservationToken`, if they already have a reservation.
        If that reservation already holds uses of the code, they still count
        as available to this attendee.
      schema:
        type: string
        format: uuid
    DeviceIdRequired:
      name: X-Device-ID
      in: header
      required: true
      description: |
        The `reservationToken` returned by `POST /events/{slug}/reservations`,
        echoed verbatim. Identifies the attendee's held reservation.
      schema:
        type: string
        format: uuid
    DeviceIdReleaseOptional:
      name: X-Device-ID
      in: header
      required: false
      description: |
        The `reservationToken` identifying the reservation to release. If omitted,
        the server releases the reservation held for your client IP + event, if
        one exists.
      schema:
        type: string
        format: uuid
  headers:
    ETag:
      description: Opaque validator for the response body. Echo it back as `If-None-Match`.
      schema:
        type: string
    CacheControl:
      description: Caching policy for the response.
      schema:
        type: string
        example: private, max-age=60, stale-while-revalidate=120

  responses:
    NotModified:
      description: The resource has not changed since the supplied ETag (no body).
    BadRequest:
      description: |
        Invalid request — malformed body, failed validation, a missing
        reservation token, a wrong sale password, a sale that is not open, or a
        reserved-seating event (not supported).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Missing or invalid API key
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: The requested resource does not exist for this host
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: |
        The key is the wrong type, or the event uses a waiting room, which this
        API does not support yet (`error_code` `event_queue_not_admitted`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooManyRequests:
      description: |
        Rate limit reached for this API key. Wait for the number of seconds in
        the `Retry-After` header, then retry.
      headers:
        Retry-After:
          description: Seconds to wait before retrying.
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: An order for this reservation is already being processed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      required: [message, status, error_code]
      properties:
        message:
          type: string
          example: Missing or invalid API key
        status:
          type: integer
          description: The HTTP status code.
          example: 401
        error_code:
          type: string
          description: A stable machine-readable error identifier.
          example: unauthorized

    HealthEnvelope:
      type: object
      required: [status, data]
      properties:
        status:
          type: boolean
          description: Overall readiness (Postgres, Redis and MongoDB reachable).
        data:
          type: object
          required: [status, message, data]
          properties:
            status:
              type: boolean
              description: Overall readiness (Postgres, Redis and MongoDB reachable).
            message:
              type: string
              example: OK
            data:
              $ref: '#/components/schemas/HealthChecks'

    HealthChecks:
      type: object
      required: [postgres, redis, meilisearch, rabbitmq, neo4j, mongodb, ai]
      description: |
        Per-dependency health. For the headless API `postgres`, `redis` and
        `mongodb` determine `status`; `meilisearch`, `rabbitmq`, `neo4j` and `ai`
        are informational.
      properties:
        postgres:
          type: boolean
        redis:
          type: boolean
        meilisearch:
          type: boolean
        rabbitmq:
          type: boolean
        neo4j:
          type: boolean
        mongodb:
          type: boolean
        ai:
          type: boolean

    EventCategory:
      type: object
      required: [name, slug]
      properties:
        name:
          type: string
        slug:
          type: string

    EventSummary:
      type: object
      required:
        - id
        - name
        - slug
        - posterImageURL
        - description
        - previewDescription
        - date
        - closingDate
        - timezone
        - status
        - isComingSoon
        - hideLocation
        - createdAt
        - cheapestTicketPrice
        - formattedCheapestPrice
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        posterImageURL:
          type: string
        posterAspectRatio:
          type: number
          description: Width/height of the poster image. Absent when unknown.
        category:
          oneOf:
            - $ref: '#/components/schemas/EventCategory'
            - type: 'null'
        cheapestTicketPrice:
          type: integer
          description: Lowest ticket price (after commission) in the smallest currency unit. 0 when the event has no purchasable tickets.
        formattedCheapestPrice:
          type: string
          description: Human-readable, country-formatted cheapest price. "Free" when 0.
        description:
          type: string
        previewDescription:
          type: string
          description: Plain-text preview derived from the markdown description.
        date:
          type: string
          format: date-time
        closingDate:
          type: string
          format: date-time
        timezone:
          type: string
        status:
          $ref: '#/components/schemas/EventStatus'
        isComingSoon:
          type: boolean
        instagram:
          type: string
        website:
          type: string
        xAccount:
          type: string
        country:
          $ref: '#/components/schemas/Country'
        state:
          type: string
        lga:
          type: string
        street:
          type: string
        directions:
          type: string
        lng:
          type: number
        lat:
          type: number
        hideLocation:
          type: boolean
        hostMessage:
          type: string
        createdAt:
          type: string
          format: date-time

    Event:
      allOf:
        - $ref: '#/components/schemas/EventSummary'
        - type: object
          required: [headliners]
          properties:
            headliners:
              type: array
              description: |
                The event's lineup: every public guest and performer shown on
                the event page. `isMainArtist` marks the main act.
              items:
                $ref: '#/components/schemas/EventHeadliner'

    EventHeadliner:
      type: object
      required: [id, name, isMainArtist]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        role:
          type: string
        imageURL:
          type: string
        isMainArtist:
          type: boolean
          description: Whether this is the event's default headliner.
        artist:
          $ref: '#/components/schemas/EventArtistProfile'

    EventArtistProfile:
      type: object
      required: [id, artistPlatformId, platform, name]
      properties:
        id:
          type: string
          format: uuid
        artistPlatformId:
          type: string
        platform:
          type: string
          enum: [SPOTIFY, DEEZER]
        name:
          type: string
        slug:
          type: string
        imageURL:
          type: string
        description:
          type: string
        bannerURL:
          type: string
    EventGalleryImage:
      type: object
      required: [id, imageURL]
      properties:
        id:
          type: string
          format: uuid
        imageURL:
          type: string
          format: uri
        altText:
          type: string

    EventGallery:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/EventGalleryImage'

    EventList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/EventSummary'
        nextCursor:
          type: string
          description: Pass as `cursor` to fetch the next page. Absent on the last page.

    SubTicket:
      type: object
      required: [id, name]
      description: A ticket bundled inside a combo ticket.
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string

    Ticket:
      type: object
      required:
        - id
        - name
        - slug
        - price
        - formattedPrice
        - fees
        - formattedFees
        - maximumPurchasableTicketCount
        - quantityLeft
        - orderCount
        - status
        - isGroup
        - isCombo
        - isRsvp
        - position
        - sales
        - includedAddons
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        description:
          type: string
        imageURL:
          type: string
        price:
          type: integer
          description: Price the buyer pays (after commission), in the smallest currency unit.
        formattedPrice:
          type: string
          description: Human-readable, country-formatted price ("FREE" when 0).
        fees:
          type: integer
          description: Platform fees included for this ticket, in the smallest currency unit.
        formattedFees:
          type: string
          description: Human-readable, country-formatted fees.
        maximumPurchasableTicketCount:
          type: integer
          description: Maximum quantity purchasable per order.
        quantityLeft:
          type: integer
          description: |
            Tickets available to buy right now, after subtracting tickets already
            sold and those currently held in other attendees' carts/reservations.
        orderCount:
          type: integer
          description: How many admissions one ticket grants (group size).
        deadline:
          type: string
          format: date-time
          description: When sales for this ticket close.
        date:
          type: string
          format: date-time
        status:
          $ref: '#/components/schemas/TicketStatus'
        isGroup:
          type: boolean
          description: Whether one ticket admits multiple people (orderCount > 1).
        isCombo:
          type: boolean
          description: Whether this ticket bundles other tickets (see subTickets).
        isRsvp:
          type: boolean
          description: Whether this is a free RSVP/registration ticket.
        subTickets:
          type: array
          description: For combo tickets, the tickets bundled inside.
          items:
            $ref: '#/components/schemas/SubTicket'
        position:
          type: integer
        emailDomainRestriction:
          type: string
          description: If set, only buyers with an email on this domain may purchase.
        sales:
          type: array
          description: |
            Open and upcoming sales that include this ticket. Empty when anyone
            can buy it without a sale.
          items:
            $ref: '#/components/schemas/TicketSale'
        includedAddons:
          type: array
          description: Add-ons that come with this ticket at no extra cost.
          items:
            $ref: '#/components/schemas/IncludedAddon'

    IncludedAddon:
      type: object
      required: [id, name, quantity]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        imageURL:
          type: string
        quantity:
          type: integer
          description: How many each admission gets.

    Addon:
      type: object
      required:
        - id
        - name
        - price
        - formattedPrice
        - fees
        - formattedFees
        - maxPerOrder
        - status
        - ticketIds
        - position
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        imageURL:
          type: string
        price:
          type: integer
          description: Price the buyer pays (after commission), in the smallest currency unit.
        formattedPrice:
          type: string
          description: Human-readable, country-formatted price ("FREE" when 0).
        fees:
          type: integer
          description: Platform fees included for this add-on, in the smallest currency unit.
        formattedFees:
          type: string
          description: Human-readable, country-formatted fees.
        value:
          type: integer
          description: What the add-on is worth, for example a voucher's face value.
        formattedValue:
          type: string
        maxPerOrder:
          type: integer
          description: |
            Maximum quantity per order. Free add-ons bought on their own are
            limited to this per email.
        quantityLeft:
          type: integer
          description: |
            Units available to buy right now, after subtracting those held in
            other attendees' carts. Absent when the add-on has no stock limit.
        deadline:
          type: string
          format: date-time
          description: When sales for this add-on close.
        status:
          type: string
          enum: [AVAILABLE, SOLD_OUT]
        ticketIds:
          type: array
          description: |
            The buyer needs one of these tickets in the cart, or already held
            when buying add-ons alone. Empty when anyone can buy the add-on.
          items:
            type: string
            format: uuid
        position:
          type: integer

    AddonList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Addon'

    SalePhase:
      type: string
      enum: [UPCOMING, ACTIVE, ENDED]
      description: |
        `UPCOMING` before `startDate`, `ACTIVE` from `startDate` until
        `endDate`, `ENDED` after `endDate`. A sale without an `endDate` stays
        `ACTIVE`.

    TicketSale:
      type: object
      required: [id, name, startDate, phase, requiresPassword]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        startDate:
          type: string
          format: date-time
        endDate:
          type: string
          format: date-time
        phase:
          $ref: '#/components/schemas/SalePhase'
        requiresPassword:
          type: boolean

    Sale:
      type: object
      required:
        - id
        - name
        - startDate
        - phase
        - requiresPassword
        - includeAllTickets
        - ticketIds
        - waitlistOpen
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: Presale
        startDate:
          type: string
          format: date-time
          description: When the sale opens.
        endDate:
          type: string
          format: date-time
          description: When the sale closes. Absent when it has no end.
        phase:
          $ref: '#/components/schemas/SalePhase'
        requiresPassword:
          type: boolean
          description: Whether buyers need a password. The password itself is never returned.
        includeAllTickets:
          type: boolean
          description: Whether the sale covers every ticket. When `true`, `ticketIds` is empty.
        ticketIds:
          type: array
          description: The tickets in this sale, when it does not cover every ticket.
          items:
            type: string
            format: uuid
        waitlistOpen:
          type: boolean
          description: Whether attendees can still join this sale's waitlist.

    SaleList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Sale'

    VerifySalePasswordRequest:
      type: object
      required: [password]
      properties:
        password:
          type: string

    VerifySalePasswordResult:
      type: object
      required: [valid]
      properties:
        valid:
          type: boolean
          const: true

    JoinSaleWaitlistRequest:
      type: object
      required: [name, email]
      properties:
        name:
          type: string
          maxLength: 255
          description: The attendee's full name.
        email:
          type: string
          format: email

    JoinSaleWaitlistResult:
      type: object
      required: [joined]
      properties:
        joined:
          type: boolean
          const: true

    TicketStatus:
      type: string
      enum:
        - AVAILABLE
        - SOLD_OUT
        - ALL_RESERVED
        - COMING_SOON
        - CLOSED
        - DEADLINE_EXCEEDED
        - SALE_NOT_STARTED
        - SALE_ENDED

    EventStatus:
      type: string
      enum: [LIVE, COMING_SOON, CLOSED, SOLD_OUT, ACTIVE]

    Country:
      type: string
      enum: [NIGERIA, GHANA, SOUTH_AFRICA]

    ReservationItemRequest:
      type: object
      required: [sku, quantity]
      properties:
        sku:
          type: string
          format: uuid
          description: The ticket type ID (from the tickets endpoint).
        quantity:
          type: integer
          minimum: 1

    ReservationAddonRequest:
      type: object
      required: [addonId, quantity]
      properties:
        addonId:
          type: string
          format: uuid
          description: The add-on ID (from the add-ons endpoint).
        quantity:
          type: integer
          minimum: 1
          maximum: 100

    CreateReservationRequest:
      type: object
      description: Send `items`, `addons` or both.
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ReservationItemRequest'
        addons:
          type: array
          maxItems: 20
          description: Add-ons to buy. List each add-on once.
          items:
            $ref: '#/components/schemas/ReservationAddonRequest'
        buyerEmail:
          type: string
          format: email
          maxLength: 255
          description: |
            Required when `addons` is sent without `items`, and ignored
            otherwise. The add-ons are delivered to this email, whichever email
            pays for the order.
        promoCode:
          type: string
          description: Optional promo code to apply to the cart. It must belong to this event; global promo codes are not supported.
        saleId:
          type: string
          format: uuid
          description: |
            The sale to buy from. Optional: when omitted, the open sale is used
            for tickets that need one.
        salePassword:
          type: string
          description: The sale's password, when `requiresPassword` is `true`.

    ReservationItemView:
      type: object
      required: [sku, quantity, price, fee]
      properties:
        sku:
          type: string
          format: uuid
        quantity:
          type: integer
        price:
          type: integer
          description: Per-ticket price (after commission), in the smallest currency unit.
        fee:
          type: integer
          description: Per-ticket platform fee, in the smallest currency unit.

    ReservationAddonView:
      type: object
      required: [addonId, quantity, price, fee]
      properties:
        addonId:
          type: string
          format: uuid
        quantity:
          type: integer
        price:
          type: integer
          description: Per-unit price, in the smallest currency unit.
        fee:
          type: integer
          description: Per-unit platform fee, in the smallest currency unit.

    Reservation:
      type: object
      required:
        - reservationToken
        - quoteReference
        - total
        - totalFees
        - items
        - addons
        - clientExpiresAt
      properties:
        reservationToken:
          type: string
          format: uuid
          description: Send as the `X-Device-ID` header on later reservation, order and release calls for this attendee.
        quoteReference:
          type: string
          description: |
            Opaque handle to the priced, server-held quote. Send it back as
            `quoteReference` when creating an order.
        total:
          type: integer
          description: Cart total (after commission) in the smallest currency unit.
        totalFees:
          type: integer
          description: Total platform fees included in the total.
        discount:
          type: integer
          description: Discount applied by a promo code, if any.
        promoCode:
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/ReservationItemView'
        addons:
          type: array
          description: The add-ons being bought. Add-ons included with tickets are not listed.
          items:
            $ref: '#/components/schemas/ReservationAddonView'
        clientExpiresAt:
          type: string
          format: date-time
          description: Client-facing deadline to drive your checkout countdown.

    CreateOrderRequest:
      type: object
      required: [quoteReference, email, firstName, lastName, callbackUrl]
      properties:
        quoteReference:
          type: string
          description: The `quoteReference` returned by the reservation response.
        email:
          type: string
          format: email
          description: |
            The attendee's email; tickets and the add-ons bought with them are
            issued to this address. Add-ons bought on their own go to the
            reservation's `buyerEmail`.
        firstName:
          type: string
        lastName:
          type: string
        phone:
          type: string
        callbackUrl:
          type: string
          format: uri
          description: |
            Where the attendee is redirected after payment. The API appends a
            `reference` query parameter.
        acceptPromotionalContent:
          type: boolean
          description: Whether the attendee opted into promotional content.
        metadata:
          type: object
          additionalProperties: true
          description: |
            Optional JSON object (max 4096 bytes) echoed back verbatim in the
            `TICKET_PURCHASED` or `ADDON_PURCHASED` webhook's `data.metadata` on
            payment success, e.g. custom checkout-form fields. Must be a JSON object, not a scalar or
            array.

    Order:
      type: object
      required: [status, reference, checkoutUrl, total]
      properties:
        status:
          type: string
          enum: [confirmed, pending_payment]
          description: |
            `confirmed` for free orders (fulfilled immediately); `pending_payment`
            for paid orders (redirect the attendee to `checkoutUrl`).
        reference:
          type: string
          description: |
            The order reference. Look the order up with
            `GET /events/{slug}/orders/{reference}`. It is also added to your
            `callbackUrl` after payment.
        checkoutUrl:
          type: string
          description: |
            For paid orders, the payment link the attendee uses to complete payment.
            For free orders, your `callbackUrl` with the `reference` appended.
        total:
          type: integer
        discount:
          type: integer
        promoCode:
          type: string
        clientExpiresAt:
          type: string
          format: date-time

    Host:
      type: object
      required: [id, name, slug, imageURL, isVerified]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
          description: The host's handle on Jetron Ticket.
        imageURL:
          type: string
          description: Profile image or logo.
        bannerImageURL:
          type: string
          description: Wide banner image. Absent when the host has none.
        isVerified:
          type: boolean
          description: Whether Jetron Ticket has verified the host.

    Sponsor:
      type: object
      required: [id, name, imageURL]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        url:
          type: string
          description: The sponsor's website. Absent when none was given.
        imageURL:
          type: string
          description: The sponsor's logo.

    SponsorList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Sponsor'

    MomentAuthor:
      type: object
      required: [name, imageURL]
      description: The attendee who posted the moment, as shown publicly on Jetron Ticket.
      properties:
        name:
          type: string
        username:
          type: string
        imageURL:
          type: string

    Moment:
      type: object
      required:
        [id, imageURL, width, height, aspectRatio, likesCount, commentsCount, author, createdAt]
      properties:
        id:
          type: string
          format: uuid
        imageURL:
          type: string
        width:
          type: integer
          description: Image width in pixels.
        height:
          type: integer
          description: Image height in pixels.
        aspectRatio:
          type: number
          description: Width divided by height.
        caption:
          type: string
        likesCount:
          type: integer
        commentsCount:
          type: integer
        author:
          $ref: '#/components/schemas/MomentAuthor'
        createdAt:
          type: string
          format: date-time

    MomentList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Moment'
        nextCursor:
          type: string
          description: Pass as `cursor` to fetch the next page. Absent on the last page.

    ValidatePromoCodeRequest:
      type: object
      required: [code]
      properties:
        code:
          type: string
          maxLength: 50
        ticketIds:
          type: array
          maxItems: 100
          description: The ticket IDs in the cart.
          items:
            type: string
            format: uuid
        quantity:
          type: integer
          minimum: 1
          description: How many tickets the code will cover. Defaults to 1.

    PromoCode:
      type: object
      required: [code, type, value, ticketIds]
      properties:
        code:
          type: string
        type:
          type: string
          enum: [PERCENTAGE, FIXED]
        value:
          type: integer
          description: |
            The discount. A percentage (for example `10` for 10%) when `type`
            is `PERCENTAGE`, or an amount in the smallest currency unit when it
            is `FIXED`.
        ticketIds:
          type: array
          description: The tickets the code applies to. Empty when it applies to every ticket.
          items:
            type: string
            format: uuid
        expiresAt:
          type: string
          format: date-time
          description: When the code stops working. Absent when it does not expire.

    OrderLine:
      type: object
      required: [sku, name, quantity, amount, formattedAmount]
      properties:
        sku:
          type: string
          format: uuid
          description: The ticket type bought.
        name:
          type: string
          description: The ticket name at purchase, even if the attendee later upgraded.
        quantity:
          type: integer
          description: Tickets bought. For a group ticket, the number of groups.
        amount:
          type: integer
          description: Total paid for this ticket type, in the smallest currency unit.
        formattedAmount:
          type: string

    OrderAddonLine:
      type: object
      required: [addonId, name, quantity, amount, formattedAmount, status]
      properties:
        addonId:
          type: string
          format: uuid
        name:
          type: string
        quantity:
          type: integer
        amount:
          type: integer
          description: Total paid for this add-on, in the smallest currency unit.
        formattedAmount:
          type: string
        status:
          type: string
          enum: [confirmed, refunded]
          description: An add-on can be refunded on its own while the order stays `confirmed`.

    OrderDetails:
      type: object
      required: [reference, status, total, formattedTotal, items, addons, createdAt]
      properties:
        reference:
          type: string
        status:
          type: string
          enum: [confirmed, refunded]
          description: |
            `confirmed` once payment is confirmed and tickets are issued;
            `refunded` after the order is refunded.
        total:
          type: integer
          description: Amount paid, in the smallest currency unit.
        formattedTotal:
          type: string
        discount:
          type: integer
          description: Discount from a promo code, if one was used.
        promoCode:
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderLine'
        addons:
          type: array
          description: The add-ons bought. Add-ons included with tickets are not listed.
          items:
            $ref: '#/components/schemas/OrderAddonLine'
        createdAt:
          type: string
          format: date-time

    LookupAttendeeTicketsRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
          maxLength: 255
          description: The attendee's email. Matching ignores case and surrounding spaces.
        eventSlug:
          type: string
          description: Only return tickets for this event. Unknown slugs return `404`.
        used:
          type: boolean
          description: |
            `false` returns orders with at least one unscanned ticket for events
            that closed less than a day ago or have not closed; `true` returns
            the rest: fully scanned orders and orders for events that closed
            more than a day ago. Omit for both.
        limit:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
        cursor:
          type: string
          description: The `nextCursor` from the previous page.

    AttendeeTicketOrderList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AttendeeTicketOrder'
        nextCursor:
          type: string
          description: Pass as `cursor` to fetch the next page. Absent on the last page.

    AttendeeTicketOrder:
      type: object
      required: [id, ticketId, ticketName, event, tickets, createdAt]
      properties:
        id:
          type: string
          format: uuid
        ticketId:
          type: string
          format: uuid
        ticketName:
          type: string
        event:
          $ref: '#/components/schemas/AttendeeTicketEvent'
        tickets:
          type: array
          description: The admissions on this order the email holds.
          items:
            $ref: '#/components/schemas/AttendeeTicket'
        createdAt:
          type: string
          format: date-time

    AttendeeTicketEvent:
      type: object
      required: [id, name, slug, date, closingDate, timezone]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        date:
          type: string
          format: date-time
        closingDate:
          type: string
          format: date-time
        timezone:
          type: string

    AttendeeTicket:
      type: object
      required: [id, name, status, addons]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          description: The admission's name; for bundles, the included ticket.
        date:
          type: string
          format: date-time
          description: The day this admission is for, on multi-day events.
        status:
          type: string
          enum: [VALID, USED, TRANSFER_PENDING, LOCKED]
          description: |
            `VALID` can be scanned. `USED` has been scanned. `TRANSFER_PENDING`
            cannot be scanned while a transfer awaits the recipient. `LOCKED`
            has a QR code that is held back until `unlocksAt`.
        qrCode:
          type: string
          description: The entry QR code value. Present only for `VALID` tickets.
        unlocksAt:
          type: string
          format: date-time
          description: When a `LOCKED` ticket's QR code becomes available. Present only for `LOCKED` tickets.
        scannedAt:
          type: string
          format: date-time
        addons:
          type: array
          description: The add-ons that came with this ticket.
          items:
            $ref: '#/components/schemas/AttendeeAddon'

    AttendeeAddonCode:
      type: object
      required: [id, code]
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
          description: The value to render as a QR code. It collects one unit.
        redeemedAt:
          type: string
          format: date-time
          description: When the unit was collected. Absent until then.

    AttendeeAddon:
      type: object
      required: [id, addonId, name, fulfillment, quantity, redeemedQuantity, codes]
      properties:
        id:
          type: string
          format: uuid
        addonId:
          type: string
          format: uuid
        name:
          type: string
        imageURL:
          type: string
        fulfillment:
          type: string
          enum: [SCAN, INSTRUCTIONS]
          description: |
            `SCAN` add-ons are collected with their QR codes. `INSTRUCTIONS`
            add-ons have no codes; follow `instructions`.
        instructions:
          type: string
        quantity:
          type: integer
        redeemedQuantity:
          type: integer
        codes:
          type: array
          description: One code per unit. Empty for `INSTRUCTIONS` add-ons.
          items:
            $ref: '#/components/schemas/AttendeeAddonCode'

    LookupAttendeeAddonsRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
          maxLength: 255
          description: The attendee's email. Matching ignores case and surrounding spaces.
        eventSlug:
          type: string
          description: Only return add-ons for this event. Unknown slugs return `404`.
        limit:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
        cursor:
          type: string
          description: The `nextCursor` from the previous page.

    AttendeeAddonPurchase:
      allOf:
        - $ref: '#/components/schemas/AttendeeAddon'
        - type: object
          required: [event, createdAt]
          properties:
            event:
              $ref: '#/components/schemas/AttendeeTicketEvent'
            createdAt:
              type: string
              format: date-time

    AttendeeAddonPurchaseList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AttendeeAddonPurchase'
        nextCursor:
          type: string
          description: Pass as `cursor` to fetch the next page. Absent on the last page.

security:
  - ApiKeyAuth: []
